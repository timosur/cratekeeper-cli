services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: djlib
      POSTGRES_USER: dj
      POSTGRES_PASSWORD: dj
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dj -d djlib"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
