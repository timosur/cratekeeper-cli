[project]
name = "cratekeeper"
version = "1.0.0"
description = "DJ library management CLI — classify, analyze, tag, and organize your music crates"
requires-python = ">=3.11"
dependencies = [
    "spotipy>=2.24.0",
    "tidalapi>=0.8.1",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "mutagen>=1.47.0",
    "thefuzz[speedup]>=0.22.0",
    "psycopg2-binary>=2.9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
audio = [
    "essentia-tensorflow>=2.1b6.dev1110; platform_system != 'Windows'",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "build>=1.0.0",
]

[project.scripts]
crate = "cratekeeper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cratekeeper"]

[tool.hatch.build.targets.wheel.shared-data]

[tool.hatch.build]
include = [
    "cratekeeper/**/*.py",
    "cratekeeper/data/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
